name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.20.0

      - name: Run test suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Validate Windows fonts and layouts
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: python packaging/windows_layout_smoke.py --output windows-ui-smoke

      - name: Build executable
        shell: cmd
        run: |
          pyinstaller ^
            --clean ^
            --noconfirm ^
            --name "MIDI Piano Jaramillo" ^
            --windowed ^
            --icon "G7alt.ico" ^
            --add-data "assets;assets" ^
            --add-data "diccionario_acordes.json;." ^
            main.py

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $app = "dist\MIDI Piano Jaramillo\MIDI Piano Jaramillo.exe"
          $asset = "dist\MIDI Piano Jaramillo\_internal\assets\fretboard-background.png"
          if (-not (Test-Path $app)) { throw "No se generó el ejecutable." }
          if (-not (Test-Path $asset)) { throw "No se incluyó el fondo del diapasón." }
          $env:QT_QPA_PLATFORM = "windows"
          $process = Start-Process $app -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "El ejecutable se cerró durante la prueba de arranque (código $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force

      - name: Package ZIP
        shell: pwsh
        run: |
          $stage = "MIDI-Piano-Jaramillo-Windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse "dist\MIDI Piano Jaramillo" "$stage\MIDI Piano Jaramillo"
          Copy-Item "release_docs\README_windows.txt" "$stage\README_windows.txt"
          Compress-Archive -Path "$stage\*" -DestinationPath "MIDI-Piano-Jaramillo-Windows.zip" -Force

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIDI-Piano-Jaramillo-Windows
          path: MIDI-Piano-Jaramillo-Windows.zip

      - name: Upload Windows UI verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MIDI-Piano-Jaramillo-Windows-UI-Smoke
          path: windows-ui-smoke
